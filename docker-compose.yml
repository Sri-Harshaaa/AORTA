services:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - aorta

  server1:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["--port", "8081"]
    environment:
      # Override to "threaded" to run the thread-per-connection model.
      AORTA_MODE: "${AORTA_MODE:-epoll}"
      AORTA_REDIS_HOST: redis
    expose:
      - "8081"
    depends_on:
      - redis
    networks:
      - aorta
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server2:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["--port", "8082"]
    environment:
      AORTA_MODE: "${AORTA_MODE:-epoll}"
      AORTA_REDIS_HOST: redis
    expose:
      - "8082"
    depends_on:
      - redis
    networks:
      - aorta
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  server3:
    build:
      context: .
      dockerfile: Dockerfile.server
    command: ["--port", "8083"]
    environment:
      AORTA_MODE: "${AORTA_MODE:-epoll}"
      AORTA_REDIS_HOST: redis
    expose:
      - "8083"
    depends_on:
      - redis
    networks:
      - aorta
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  lb:
    build:
      context: .
      dockerfile: Dockerfile.lb
    environment:
      # round_robin | least_connections | consistent_hash
      AORTA_LB_STRATEGY: "${AORTA_LB_STRATEGY:-round_robin}"
      AORTA_LB_BACKENDS: /app/config/backends.conf
    ports:
      - "9000:9000"
    volumes:
      - ./config/backends.docker.conf:/app/config/backends.conf:ro
    depends_on:
      - server1
      - server2
      - server3
    networks:
      - aorta
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  aorta:
    driver: bridge

volumes:
  redis_data:
